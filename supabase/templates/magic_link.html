<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2933;
    "
  >
    <table
      role="presentation"
      width="100%"
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 10px;
        overflow: hidden;
      "
    >
      <tr>
        <td style="height: 6px; background: #0d82e4"></td>
      </tr>
      <tr>
        <td style="padding: 32px">
          <h1
            style="
              margin: 0 0 4px;
              font-size: 22px;
              color: #0d82e4;
              letter-spacing: 1px;
            "
          >
            ZEPHVION CRM
          </h1>
          <p style="margin: 0 0 24px; font-size: 14px; color: #52606d">
            Your sign-in code
          </p>
          <p
            style="
              margin: 0 0 24px;
              font-size: 32px;
              font-weight: bold;
              letter-spacing: 8px;
              text-align: center;
              background: #eef6fd;
              border-radius: 8px;
              padding: 16px;
            "
          >
            {{ .Token }}
          </p>
          <p style="margin: 0 0 8px; font-size: 14px">
            Enter this code on the Zephvion CRM sign-in page. It expires in 1
            hour and can be used once.
          </p>
          <p style="margin: 0; font-size: 12px; color: #7b8794">
            Didn't try to sign in? You can safely ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
