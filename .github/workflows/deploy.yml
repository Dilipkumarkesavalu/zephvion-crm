name: 🚀 Deploy demo
on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: 🔨 Build demo
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # The demo runs entirely in the browser on sample data (no backend)
            VITE_IS_DEMO: true
            # Keeps the bundle visualizer from trying to open a browser
            NODE_ENV: CI
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build:demo

            - name: 📦 Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: 📡 Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 📡 Deploy
              id: deployment
              uses: actions/deploy-pages@v4
