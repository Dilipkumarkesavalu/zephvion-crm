name: 🚀 Deploy
on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: true

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: 🔨 Build demo and CRM
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            # The demo runs entirely in the browser on sample data (no backend)
            VITE_IS_DEMO: true
            # Keeps the bundle visualizer from trying to open a browser
            NODE_ENV: CI
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            # The real CRM (email-code login, Supabase data) is published under
            # /app/ once the SUPABASE_URL and SB_PUBLISHABLE_KEY repository
            # variables exist. See docs/ZEPHVION_SETUP.md.
            - name: 🔨 Build CRM app
              if: ${{ vars.SUPABASE_URL != '' && vars.SB_PUBLISHABLE_KEY != '' }}
              run: npx vite build --outDir dist-app
              env:
                  VITE_IS_DEMO: false
                  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
                  VITE_SB_PUBLISHABLE_KEY: ${{ vars.SB_PUBLISHABLE_KEY }}
                  VITE_ATTACHMENTS_BUCKET: attachments
                  VITE_LOGIN_WITH_EMAIL_OTP: true
                  VITE_ALLOWED_EMAIL_DOMAIN: zephvion.com

            - name: 🔨 Build demo
              run: npm run build:demo

            - name: 📁 Place CRM app under /app
              if: ${{ vars.SUPABASE_URL != '' && vars.SB_PUBLISHABLE_KEY != '' }}
              run: mv dist-app dist/app

            - name: 📦 Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        name: 📡 Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 📡 Deploy
              id: deployment
              uses: actions/deploy-pages@v4
